name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild clean build \
            -project MovieApp.xcodeproj \
            -scheme MovieApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to Unsigned IPA
        run: |
          echo "=== Searching for compiled .app bundle ==="
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found .app bundle at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in build directory!"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          TARGET_APP=$(find Payload -name "*.app" -type d | head -n 1)
          if [ -d "MovieApp/Icons" ]; then
            echo "Copying icon PNG files into app bundle..."
            cp MovieApp/Icons/*.png "$TARGET_APP/" || true
          fi
          zip -r MovieApp_Unsigned.ipa Payload
          rm -rf Payload
          echo "=== Successfully created MovieApp_Unsigned.ipa ==="

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieApp-Unsigned-IPA
          path: MovieApp_Unsigned.ipa
          if-no-files-found: error
